<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Credenciales en Vivo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f6f9; margin: 0; padding: 20px; }
        h2 { color: #333; }
        video { width: 100%; max-width: 400px; border-radius: 12px; border: 3px solid #007bff; background: #000; }
        button { background: #28a745; color: white; border: none; padding: 14px 28px; font-size: 18px; border-radius: 50px; margin-top: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        button:active { background: #218838; transform: scale(0.98); }
        #resultado { margin-top: 20px; text-align: left; background: white; padding: 15px; border-radius: 10px; display: inline-block; width: 90%; max-width: 400px; box-shadow: 0px 2px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h2>📷 Escáner Escolar</h2>
    <video id="video" autoplay playsinline></video><br>
    <button id="capturar">📸 Capturar y Leer</button>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="resultado"><b>Estado:</b> Enfoca el documento y presiona capturar.</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const capturarBtn = document.getElementById('capturar');
        const resultadoDiv = document.getElementById('resultado');

        // Pega aquí la URL de tu Apps Script Web App (/exec)
        const WEB_APP_URL = "TU_URL_DE_APPS_SCRIPT_AQUI";

        // Iniciar la cámara trasera del celular automáticamente
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("No se pudo acceder a la cámara: " + err); });

        capturarBtn.addEventListener('click', async () => {
            resultadoDiv.innerHTML = "⏳ Analizando foto... Por favor espera.";
            
            // Tomar la foto actual del video en vivo
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const base64Image = canvas.toDataURL('image/jpeg');

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ image: base64Image })
                });
                const resJson = await response.json();
                
                if(resJson.status === "success") {
                    const d = resJson.data;
                    resultadoDiv.innerHTML = `<h3>✅ ¡Guardado en Google Sheets!</h3>` +
                        `<p><b>Escuela:</b> ${d.escuela}</p>` +
                        `<p><b>Nombre:</b> ${d.nombre}</p>` +
                        `<p><b>Matrícula:</b> ${d.matricula}</p>` +
                        `<p><b>Carrera:</b> ${d.carrera}</p>`;
                } else {
                    resultadoDiv.innerHTML = "❌ Error al procesar la imagen.";
                }
            } catch (e) {
                resultadoDiv.innerHTML = "❌ Error de conexión: " + e.message;
            }
        });
    </script>
</body>
</html>
