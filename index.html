<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Códigos Estilo Supermercado</title>
    <!-- Importar la librería de escaneo en tiempo real (ZXing) -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; margin: 0; padding: 20px; }
        h2 { color: #00ffcc; }
        #video-container { width: 100%; max-width: 500px; margin: 0 auto; position: relative; border-radius: 12px; overflow: hidden; border: 3px solid #00ffcc; }
        video { width: 100%; height: auto; display: block; }
        #resultado-box { margin-top: 20px; background: #1e1e1e; padding: 15px; border-radius: 10px; display: inline-block; width: 90%; max-width: 500px; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); }
        .ultimo-codigo { font-size: 24px; color: #ffeb3b; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🛒 Escáner de Códigos Ultrarrápido</h2>
    <p>Apunta el código de barras frente a la cámara. Se leerá automáticamente.</p>

    <div id="video-container">
        <video id="video"></video>
    </div>

    <div id="resultado-box">
        <div>Último código detectado:</div>
        <div id="codigoDetectado" class="ultimo-codigo">Esperando escaneo...</div>
    </div>

    <script>
        window.addEventListener('load', function () {
            const codeReader = new ZXing.BrowserBarcodeReader();
            const elementoResultado = document.getElementById('codigoDetectado');
            
            // Usar la cámara trasera del dispositivo ('environment')
            codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
                if (result) {
                    // ¡Código detectado al instante!
                    const codigoLeido = result.text;
                    elementoResultado.innerText = codigoLeido;
                    
                    // Opcional: Reproducir un sonido corto de éxito estilo caja registradora
                    reproducirBip();
                    
                    console.log("Código escaneado:", codigoLeido);
                    
                    // AQUÍ PUEDES MANDARLO A GOOGLE SHEETS AUTOMÁTICAMENTE
                    // fetch('TU_URL_DE_APPS_SCRIPT?codigo=' + codigoLeido);
                }
                if (err && !(err instanceof ZXing.NotFoundException)) {
                    // Errores menores de escaneo mientras busca el código se ignoran
                }
            }).catch(err => {
                console.error("Error al iniciar la cámara: ", err);
                alert("No se pudo acceder a la cámara. Revisa los permisos.");
            });
        });

        function reproducirBip() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Frecuencia del bip
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1); // Duración de 100 milisegundos
        }
    </script>
</body>
</html>
